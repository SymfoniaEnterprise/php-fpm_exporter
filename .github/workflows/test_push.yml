name: Test Push
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'releases/*'

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: 1.25.5
      id: go

    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: v2.14.0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:

    - name: Setup Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: 1.25.5
      id: go

    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Test
      run: go test -coverprofile cover.out ./...

  trivy-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Trivy
      uses: aquasecurity/setup-trivy@v0.3.1

    - name: Run Trivy filesystem scan
      run: |
        trivy fs \
          --config trivy.yaml \
          --format sarif \
          --output trivy-fs-results.sarif \
          .

    - name: Upload Trivy filesystem SARIF
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: trivy-fs-results.sarif
        category: trivy-fs

  trivy-image-scan:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Build image
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        push: false
        load: true
        tags: php-fpm_exporter:scan

    - name: Set up Trivy
      uses: aquasecurity/setup-trivy@v0.3.1

    - name: Run Trivy image scan
      run: |
        trivy image \
          --config /dev/null \
          --ignorefile .trivyignore \
          --format sarif \
          --output trivy-image-results.sarif \
          --severity HIGH,CRITICAL \
          php-fpm_exporter:scan

    - name: Upload Trivy image SARIF
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: trivy-image-results.sarif
        category: trivy-image
