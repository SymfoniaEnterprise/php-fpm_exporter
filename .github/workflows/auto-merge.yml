name: Auto-Merge
on:
  pull_request_target

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest

    if: github.actor == 'dependabot[bot]' || github.actor == 'dependabot-preview[bot]'
    steps:
    - uses: alexwilson/enable-github-automerge-action@3.0.0
      with:
        github-token: "${{ secrets.GITHUB_TOKEN }}"
