name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "28 21 * * 6"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    uses: SymfoniaEnterprise/github-pipelines/.github/workflows/reusable-codeql.yml@main
    with:
      languages_json: '["go"]'
      codeql_build_mode: autobuild
